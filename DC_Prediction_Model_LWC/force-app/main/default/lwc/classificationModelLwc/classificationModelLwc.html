<template>
    <article class="lwc-shell">
        <div class="lwc-shell__header">
            <h2 class="lwc-shell__title">{mainCardTitleDisplay}</h2>
            <div class="lwc-shell__actions">
                <template lwc:if={showThemeSwitcher}>
                    <div class="pm-theme-switcher">
                        <span class="pm-theme-lbl">Theme</span>
                        <div class="pm-theme-btns">
                            <template for:each={themeButtons} for:item="btn">
                                <button
                                    key={btn.key}
                                    type="button"
                                    class={btn.class}
                                    data-theme={btn.name}
                                    onclick={handleThemeSwitch}
                                    title={btn.title}
                                >
                                    {btn.glyph}
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
                <lightning-button
                    variant="neutral"
                    label="Refresh"
                    onclick={refreshData}
                    disabled={loadingFlow}
                ></lightning-button>
            </div>
        </div>

        <template lwc:if={loadingFlow}>
            <div class="lwc-spinner-wrap">
                <lightning-spinner alternative-text="Loading model output" size="medium"></lightning-spinner>
            </div>
        </template>
        <template lwc:elseif={errorMessage}>
            <p class="lwc-error">{errorMessage}</p>
        </template>
        <template lwc:elseif={hasData}>
            <div class="two-col">
                <template lwc:if={showPercentGauge}>
                    <div class="gauge-wrap">
                        <svg
                            class="gauge-svg"
                            width="170"
                            height="170"
                            viewBox="0 0 200 200"
                            xmlns="http://www.w3.org/2000/svg"
                            role="img"
                            aria-label={gaugeAriaLabel}
                        >
                            <circle
                                class="gauge-track-ring"
                                cx="100"
                                cy="100"
                                r="80"
                                fill="none"
                                stroke-width="14"
                            ></circle>
                            <circle
                                class="gauge-arc"
                                cx="100"
                                cy="100"
                                r="80"
                                fill="none"
                                stroke={gaugeArcSolidColor}
                                stroke-width="14"
                                stroke-linecap="round"
                                transform="rotate(-90 100 100)"
                                stroke-dasharray="502"
                                stroke-dashoffset="502"
                            ></circle>
                        </svg>
                        <div class="gauge-label">
                            <template lwc:if={hasPredictionValue}>
                                <div class="gauge-score-line">
                                    <span class="score-num">{scorePercentRounded}</span>
                                    <span class="score-pct">%</span>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="gauge-score-line">
                                    <span class="score-num score-num--empty">—</span>
                                </div>
                            </template>
                            <span class="score-sub">{gaugeSubtitleDisplay}</span>
                        </div>
                    </div>
                </template>
                <template lwc:else>
                    <div class="value-hero-panel">
                        <div class="value-hero" role="img" aria-label={numericAriaLabel}>
                            <template lwc:if={hasPredictionValue}>
                                <div class="value-hero__amount">
                                    <template lwc:if={isCurrencyFormat}>
                                        <lightning-formatted-number
                                            value={predictionNumber}
                                            format-style="currency"
                                            currency-code={resolvedCurrencyCode}
                                            minimum-fraction-digits={numericMinimumFractionDigits}
                                            maximum-fraction-digits={numericMaximumFractionDigits}
                                        ></lightning-formatted-number>
                                    </template>
                                    <template lwc:else>
                                        <lightning-formatted-number
                                            value={predictionNumber}
                                            format-style="decimal"
                                            minimum-fraction-digits={numericMinimumFractionDigits}
                                            maximum-fraction-digits={numericMaximumFractionDigits}
                                        ></lightning-formatted-number>
                                    </template>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="value-hero__amount value-hero__amount--empty">
                                    <span class="value-hero__placeholder">—</span>
                                </div>
                            </template>
                            <span class="value-hero__caption">{gaugeSubtitleDisplay}</span>
                        </div>
                    </div>
                </template>

                <div class="lwc-right-col">
                    <section class="predict-section" aria-labelledby="factors-heading">
                        <span id="factors-heading" class="section-label">{factorsSectionTitleDisplay}</span>
                        <template lwc:if={isKeyDriversMode}>
                            <template lwc:if={hasFactorRows}>
                                <span class="section-caption">What moved this score, and which way</span>
                                <template for:each={keyDriverFactors} for:item="item">
                                    <div key={item.key} class="kd-row" title={item.tooltip}>
                                        <span class="kd-rank">{item.rank}</span>
                                        <span class="kd-label">
                                            {item.labelText}
                                            <template lwc:if={item.valueText}>
                                                <span class="kd-value"> {item.valueText}</span>
                                            </template>
                                        </span>
                                        <span class="kd-dir">
                                            <span class="kd-glyph" style={item.dirStyle} aria-hidden="true">{item.dirGlyph}</span>
                                            {item.dirText}
                                        </span>
                                        <div class="kd-track">
                                            <div
                                                class="bar-fill kd-bar"
                                                style={item.barStyle}
                                                data-scale={item.barScale}
                                            ></div>
                                        </div>
                                        <span class="kd-tier">{item.tierLabel}</span>
                                    </div>
                                </template>
                                <div class="kd-legend" role="presentation">
                                    <template for:each={keyDriverTiers} for:item="tier">
                                        <span key={tier.key} class="kd-legend-item">
                                            <span class="kd-dot" style={tier.dotStyle}></span>{tier.label}
                                        </span>
                                    </template>
                                    <span class="kd-legend-item">▲ raises · ▼ lowers</span>
                                </div>
                                <p class="kd-note">Strength is relative to the top driver.</p>
                            </template>
                            <template lwc:else>
                                <p class="lwc-empty">No predictors returned.</p>
                            </template>
                        </template>
                        <template lwc:elseif={hasFactorRows}>
                            <template for:each={processedFactors} for:item="item">
                                <div key={item.key} class="factor-row">
                                    <span class={item.deltaClass}>{item.formattedPercent}</span>
                                    <div class="bar-track">
                                        <div
                                            class="bar-fill"
                                            style={item.barStyle}
                                            data-scale={item.barScale}
                                        ></div>
                                    </div>
                                    <span class="factor-label" title={item.detail}>{item.detail}</span>
                                </div>
                            </template>
                        </template>
                        <template lwc:else>
                            <p class="lwc-empty">No predictors returned.</p>
                        </template>
                    </section>

                    <div class="section-rule" role="presentation"></div>

                    <section class="improve-section" aria-labelledby="recs-heading">
                        <span id="recs-heading" class="section-label">{recommendationsSectionTitleDisplay}</span>
                        <template lwc:if={isKeyDriversMode}>
                            <template lwc:if={hasKeyDriverImprovements}>
                                <span class="section-caption">Change one input, estimated score lift</span>
                                <template for:each={keyDriverImprovements} for:item="item">
                                    <div key={item.key} class="kd-row kd-row--improve" title={item.tooltip}>
                                        <span class="kd-rank">{item.rank}</span>
                                        <span class="kd-label">
                                            {item.labelText}
                                            <template lwc:if={item.hasCurrent}>
                                                <span class="kd-value"> {item.currentText}</span>
                                            </template>
                                            <span class="kd-value"> → {item.targetText}</span>
                                        </span>
                                        <span class="kd-pts">{item.ptsText} pts</span>
                                        <div class="kd-track">
                                            <div
                                                class="bar-fill kd-bar"
                                                style={item.barStyle}
                                                data-scale={item.barScale}
                                            ></div>
                                        </div>
                                    </div>
                                </template>
                            </template>
                            <template lwc:else>
                                <p class="lwc-empty">No recommendations returned.</p>
                            </template>
                        </template>
                        <template lwc:elseif={hasRecommendationRows}>
                            <template for:each={processedRecommendations} for:item="item">
                                <div key={item.key} class="factor-row">
                                    <span class={item.deltaClass}>{item.formattedPercent}</span>
                                    <div class="bar-track">
                                        <div
                                            class="bar-fill"
                                            style={item.barStyle}
                                            data-scale={item.barScale}
                                        ></div>
                                    </div>
                                    <span class="factor-label" title={item.detail}>{item.detail}</span>
                                </div>
                            </template>
                        </template>
                        <template lwc:else>
                            <p class="lwc-empty">No recommendations returned.</p>
                        </template>
                    </section>
                </div>
            </div>

            <template lwc:if={showSummaryCard}>
                <div class="agent-summary">
                    <template lwc:if={loadingSummary}>
                        <div class="lwc-spinner-wrap lwc-spinner-wrap--small">
                            <lightning-spinner alternative-text="Generating summary" size="small"></lightning-spinner>
                        </div>
                    </template>
                    <template lwc:elseif={summaryError}>
                        <p class="lwc-error lwc-error--summary">{summaryError}</p>
                    </template>
                    <template lwc:elseif={summaryText}>
                        <p class="agent-summary__text">{summaryText}</p>
                    </template>
                </div>
            </template>
        </template>
        <template lwc:else>
            <p class="lwc-placeholder">
                Configure the autolaunched flow API name and place this component on a record page with a valid record
                Id.
            </p>
        </template>
    </article>
</template>
