name: Mirror to sfdc-qbranch-emu/jedais-j-fdo

on:
  push:
    branches:
      - '**'
  schedule:
    - cron: '0 13 * * *' # daily 13:00 UTC safety net in case a push-triggered run is missed
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history and all refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror-push to target repo
        env:
          MIRROR_TARGET_TOKEN: ${{ secrets.MIRROR_TARGET_TOKEN }}
        run: |
          git remote add mirror-target "https://x-access-token:${MIRROR_TARGET_TOKEN}@github.com/sfdc-qbranch-emu/jedais-j-fdo.git"
          git push mirror-target --mirror
