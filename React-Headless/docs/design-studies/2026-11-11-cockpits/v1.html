const app=document.getElementById('app'),dialog=document.getElementById('dialog');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const d=studies[persona];document.body.className=persona;document.querySelectorAll('[data-persona]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.persona===persona));app.innerHTML=`<div class="shell entrance"><aside class="rail"><div class="brand">${icon('cloud')}Cumulus</div><div class="edition">${d.edition}</div><div class="nav-label">Workspace</div><nav aria-label="Workspace filters">${d.nav.map((n,i)=>`<button data-nav="${['all','growth','risk'][i]}" class="${filter===['all','growth','risk'][i]?'active':''}">${icon(['home','chart','heart'][i])}${n}</button>`).join('')}</nav><div class="rail-note">${icon('layers')}<br>Evidence in context.<br>Action within reach.</div><div class="user"><span class="avatar">${d.initials}</span><span>${d.user}<small>${d.edition}</small></span></div></aside><div class="content"><header class="topbar"><div class="crumb">${d.edition} &nbsp; / &nbsp; <span>My day</span></div><label class="search">${icon('search')}<input id="search" aria-label="Search saved relationships" placeholder="Find a relationship…" value="${esc(query)}"><kbd>⌘ K</kbd></label></header><main class="main"><div class="intro"><div><p class="eyebrow">${d.kicker}</p><h1>${d.title}</h1><p>${d.subtitle}</p></div><div class="date"><i></i>Saved study · Nov 11, 2026</div></div><section class="opening" aria-label="Persona priorities"><div class="feature"><div class="eyebrow">${icon('spark')}${d.focus}</div><h2>${d.headline}</h2><p>${d.description}</p><div class="feature-foot"><button class="button" id="focus">${d.cta}${icon('arrow')}</button><span class="source">Evidence → context → action</span></div></div><div class="snapshot"><div class="section-head"><h3>${d.snapshotTitle}</h3>${icon(persona==='commercial'?'shield':persona==='wealth'?'chart':'users')}</div><div class="metric-row"><div class="metric"><div class="number">${d.metric1}</div><label>${d.label1}</label></div><div class="metric"><div class="number">${d.metric2}</div><label>${d.label2}</label></div></div><div class="snapshot-note">${d.snapshotNote}</div>${persona==='retail'?'<div class="chart" aria-label="HELOAN 3 views, Auto Loan 2 views"><div class="bar" style="height:100%"><span>HELOAN</span></div><div class="bar" style="height:66.67%;opacity:.35"><span>Auto Loan</span></div></div>':persona==='wealth'?'<div class="concentration" aria-label="MSFT 31.4305 percent of holdings"><span style="width:31.4305%"></span></div><div class="legend"><span>MSFT</span><span>Other holdings</span></div>':'<p class="subtle" style="margin-bottom:0">D&B payment behavior · Moody’s Watch outlook</p>'}</div></section><section class="workspace" aria-label="Relationship workspace"><div class="worklist"><div class="section-head"><h2>${d.listTitle}</h2><small id="count"></small></div><div class="filters" role="group" aria-label="Signal type"><button data-filter="all">All signals</button><button data-filter="risk">Protect</button><button data-filter="growth">Grow</button></div><div class="list" id="rows"></div><div class="list-foot">${d.listNote} · ${d.book}<br>Select a relationship to keep its evidence and next step in view.</div></div><aside class="inspector" id="inspector" aria-label="Selected relationship"></aside></section><footer class="bottom"><span>${icon('layers')}Data 360 evidence · CRM action design · Agentforce preparation</span><span>Historical fixtures · simulated actions · no live connection</span></footer></main></div></div>`;renderRows();renderInspector();bind();}
function renderRows(){const d=studies[persona],rows=d.rows.map((r,i)=>({...r,i})).filter(r=>(filter==='all'||r.kind===filter)&&`${r.name} ${r.reason}`.toLowerCase().includes(query.toLowerCase()));document.getElementById('count').textContent=`${rows.length} shown`;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',b.dataset.filter===filter)});document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===filter));document.getElementById('rows').innerHTML=rows.length?rows.map(r=>`<button class="row ${selected===r.i?'selected':''}" data-row="${r.i}" aria-pressed="${selected===r.i}"><span class="row-avatar">${r.name.split(/[ -]/).slice(0,2).map(x=>x[0]).join('')}</span><span><span class="row-name">${r.name}</span><span class="row-reason">${r.reason}</span></span><span class="row-kind ${r.kind}">${r.kind==='risk'?'Protect':'Grow'} ↗</span></button>`).join(''):'<p class="empty">No saved signals match this view. Try All signals or clear your search.</p>';document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{selected=+b.dataset.row;tab='evidence';renderRows();renderInspector()});}
function renderInspector(){const r=studies[persona].rows[selected];document.getElementById('inspector').innerHTML=`<div class="inspector-top"><div class="eyebrow">Relationship workspace ${icon('external')}</div><h2>${r.name}</h2><div class="subtle">${r.segment}</div></div><div class="inspector-tabs" role="group" aria-label="Relationship detail"><button data-tab="evidence" class="${tab==='evidence'?'active':''}" aria-pressed="${tab==='evidence'}">The evidence</button><button data-tab="approach" class="${tab==='approach'?'active':''}" aria-pressed="${tab==='approach'}">Suggested approach</button></div><div class="inspector-body" key="${selected}-${tab}">${tab==='evidence'?`<div class="evidence">${r.evidence.map(([title,body,source])=>`<div class="evidence-item">${icon('layers')}<div><b>${title}</b><p>${body}</p><small>${source} · saved fixture</small></div></div>`).join('')}</div>`:`<div class="evidence-item">${icon('spark')}<div><b>A starting point for your conversation</b><p>${r.approach}</p><small>Authored study copy · not generated by Agentforce</small></div></div>`}</div><div class="inspector-action"><button class="button" id="prepare">${icon('brief')}${r.action}${icon('arrow')}</button><p>Preview preparation · review before taking action</p></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderInspector()});document.getElementById('prepare').onclick=openPreparation;}
function bind(){document.getElementById('search').oninput=e=>{query=e.target.value;renderRows()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderRows()});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{filter=b.dataset.nav;renderRows();document.querySelector('.workspace').scrollIntoView({behavior:'smooth',block:'start'})});document.getElementById('focus').onclick=()=>{selected=0;filter='all';query='';tab='evidence';document.getElementById('search').value='';renderRows();renderInspector();document.getElementById('inspector').scrollIntoView({behavior:'smooth',block:'nearest'});document.getElementById('prepare').focus({preventScroll:true});};}
function showDialog(title,content){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-content').innerHTML=content;dialog.showModal();}
function openPreparation(){const r=studies[persona].rows[selected];showDialog('Prepare the conversation',`<p class="eyebrow">${r.name}</p><p>This previews how evidence could become a banker-reviewed brief. No AI request or CRM write is made.</p><label for="draft">Preparation notes</label><textarea id="draft">${esc(r.approach+'\n\nEvidence to review:\n'+r.evidence.map(x=>'• '+x[0]+': '+x[1]).join('\n'))}</textarea><button class="button" id="save-draft">${icon('check')}Keep in this study session</button><p id="status" role="status"></p>`);const key=`cumulus-study:${persona}:${selected}`;const saved=sessionStorage.getItem(key);if(saved)document.getElementById('draft').value=saved;document.getElementById('save-draft').onclick=()=>{sessionStorage.setItem(key,document.getElementById('draft').value);document.getElementById('status').textContent='Notes retained in this browser tab. No Salesforce record created.'};}
document.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.querySelectorAll('[data-persona]').forEach(b=>b.onclick=()=>{persona=b.dataset.persona;selected=0;filter='all';query='';tab='evidence';const url=new URL(location);url.searchParams.set('persona',persona);history.replaceState(null,'',url);render()});
document.getElementById('about').onclick=()=>showDialog('Three roles. Three working rhythms.',`<p><strong>Retail / The relationship desk.</strong> Warm evergreen and open space. Customer intent leads to a timely needs conversation.</p><p><strong>Wealth / The advisory desk.</strong> Parchment, bronze, and editorial typography. Household trust and financial context lead the experience.</p><p><strong>Commercial / Relationship command.</strong> Ink blue, structured evidence, and denser company context. Protect and develop the book.</p><p>These are disposable design studies, not deployed applications. Values come from saved real-row fixtures in the repository, captured Nov 10–11, 2026. They are selected examples, not complete books or current totals. Suggested approaches are authored concept copy. Actions only retain notes in this browser session.</p><p>Try switching personas, filtering Protect / Grow, selecting relationships, searching, reviewing evidence, and preparing editable notes.</p>`);
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!dialog.open)document.getElementById('search').focus()}});render();
</script>
</body>
</html>
