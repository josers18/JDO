<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace accent studies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#252a29;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}main{max-width:1510px;margin:auto;padding:clamp(20px,4vw,64px)}h1,h2,h3,h4,p,figure{margin:0}h1{font-size:clamp(36px,5vw,66px);letter-spacing:-.06em;line-height:1.06;font-weight:550}header>p{color:#585e5b;margin:12px 0 24px;max-width:66ch}.switch{display:inline-flex;background:white;padding:4px;border:1px solid #d8dbd6;border-radius:13px;flex-wrap:wrap;gap:3px}button{font:inherit;border:0;background:transparent;border-radius:9px;padding:8px 15px;color:#38413e;cursor:pointer}button[aria-pressed=true]{background:var(--base);color:white}button:focus-visible{outline:3px solid #363b3a;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,30px);margin-top:30px}.option h2{font-size:23px;letter-spacing:-.045em}.desc{font-size:15px;color:#535955;margin:5px 0 16px;min-height:3em}.sample{border:1px solid color-mix(in srgb,var(--base) 25%,white);border-radius:16px;background:white;overflow:hidden;color:#222b29}.hero{background:color-mix(in srgb,var(--base) 12%,white);padding:20px 19px;border-bottom:1px solid color-mix(in srgb,var(--base) 22%,white)}.hero small{color:var(--base);font-weight:600}.hero h3{font-size:24px;letter-spacing:-.045em;margin:4px 0}.hero p{font-size:14px;color:#464d49}.metric{display:flex;align-items:baseline;gap:8px;margin-top:16px}.metric b{font-size:31px;letter-spacing:-.05em}.metric span{color:#4c5551;font-size:13px}.detail{padding:19px}.detail h4{font-size:17px;letter-spacing:-.025em}.move{margin:9px 0 17px;padding:12px 14px;background:color-mix(in srgb,var(--spot) 8%,white);border-left:4px solid var(--spot);border-radius:6px}.move b{color:var(--spot);font-size:14px}.move p,.note{font-size:14px}.status{display:inline-block;padding:3px 8px;border-radius:6px;font-weight:600;font-size:12px;background:#faedce;color:#77500d}.watch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0 15px;border-bottom:1px solid #e3e5e1;font-size:14px}.series{margin-top:17px}.row{display:grid;grid-template-columns:95px 1fr 38px;align-items:center;gap:7px;font-size:13px;margin-top:9px}.track{height:9px;background:#f0f1ed;border-radius:4px;overflow:hidden}.bar{display:block;height:100%;width:var(--w);background:var(--fill);border-radius:4px}.row strong{text-align:right;font-variant-numeric:tabular-nums}.note{margin:24px 0;color:#585e5b}@media(max-width:950px){.grid{grid-template-columns:1fr}.desc{min-height:0}.sample{display:grid;grid-template-columns:minmax(180px,.8fr) 1fr}.hero{border:0}}@media(max-width:540px){.sample{display:block}.switch button{padding:8px 11px}}
</style></head><body><main><header><h1>Workspace accent studies</h1><p>Compare three treatments of the same dashboard. Switch workspaces to see how each treatment works with the existing theme.</p><div class="switch" role="group" aria-label="Workspace"></div></header><div class="grid" aria-live="polite"></div><p class="note">Illustrative data. Amber indicates an item that needs attention in every treatment.</p></main>
<script>
const personas={
 Commercial:{base:'#4c7062',secondary:'#914c38',hero:'Keep your companies moving.',kpi:'Open opportunities',n:'231',next:'Treasury review',detail:'Schedule the operating-deposit review.',watch:'Credit review',chart:'Offer opportunities',labels:['Treasury','Lending','Corporate card']},
 Wealth:{base:'#816d48',secondary:'#3f6774',hero:'Make the next conversation count.',kpi:'Upcoming reviews',n:'18',next:'Prepare a review',detail:'Revisit the household’s income plan.',watch:'Plan review',chart:'Outside assets',labels:['Brokerage','Retirement','Cash']},
 Retail:{base:'#366887',secondary:'#84566f',hero:'Keep your book in view.',kpi:'Active relationships',n:'248',next:'Prepare a call',detail:'Follow up on the savings conversation.',watch:'Service follow-up',chart:'Customer needs',labels:['Savings','Home lending','Investing']}
};
const studies=[
 ['Status only','Keep actions and charts in the workspace color. Reserve contrasting color for items that need attention.'],
 ['Highlight the next move','Use one complementary accent for the recommended action. Keep the rest of the dashboard quiet.'],
 ['Differentiate the chart','Keep actions in the workspace color. Give each chart category a distinct hue for easier comparison.']
];
const switcher=document.querySelector('.switch'),grid=document.querySelector('.grid');
for(const name of Object.keys(personas)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>render(name);switcher.append(b)}
function render(name){
 const p=personas[name];document.body.style.setProperty('--base',p.base);
 for(const b of switcher.children)b.setAttribute('aria-pressed',String(b.textContent===name));
 grid.innerHTML=studies.map(([title,description],i)=>{
 const fills=i===2?[p.base,p.secondary,'#65705a']:[p.base,p.base,p.base];
 return '<section class="option" style="--spot:'+(i===1?p.secondary:p.base)+'"><h2>'+title+'</h2><p class="desc">'+description+'</p><div class="sample"><div class="hero"><small>Cumulus · '+name+'</small><h3>'+p.hero+'</h3><div class="metric"><b>'+p.n+'</b><span>'+p.kpi+'</span></div></div><div class="detail"><h4>Next move</h4><div class="move"><b>'+p.next+'</b><p>'+p.detail+'</p></div><div class="watch"><span>'+p.watch+'</span><span class="status">Due today</span></div><figure class="series"><figcaption><h4>'+p.chart+'</h4></figcaption>'+p.labels.map((label,j)=>'<div class="row"><span>'+label+'</span><div class="track"><i class="bar" style="--w:'+([52,31,17][j])+'%;--fill:'+fills[j]+'"></i></div><strong>'+([52,31,17][j])+'%</strong></div>').join('')+'</figure></div></div></section>'
 }).join('')
}
render('Commercial');
</script></body></html>
