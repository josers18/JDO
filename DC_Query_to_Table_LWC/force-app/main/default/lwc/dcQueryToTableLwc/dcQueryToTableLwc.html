<template>
    <article class={shellClassName} style={shellStyleString}>
        <template if:true={showHeaderRow}>
            <div class={headerClassName}>
                <template if:true={titleVisible}>
                    <div class="dcqt-shell__title-group">
                        <lightning-icon
                            icon-name={resolvedHeaderIconName}
                            size="small"
                            alternative-text=""
                            class="dcqt-shell__icon"
                        ></lightning-icon>
                        <h2 class="dcqt-shell__title">{resolvedCardTitle}</h2>
                    </div>
                </template>
                <div class="dcqt-shell__header-actions">
                    <template if:true={showRunButton}>
                        <lightning-button
                            variant="brand"
                            label="Run query"
                            title="Run the Data Cloud SQL from App Builder"
                            onclick={handleRun}
                            disabled={loading}
                        ></lightning-button>
                    </template>
                    <template if:true={loading}>
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </template>
                </div>
            </div>
        </template>

        <div class="dcqt-shell__body">
            <template if:true={errorMessage}>
                <div class="dcqt-shell__error slds-text-color_error" role="alert">{errorMessage}</div>
            </template>
            <template if:true={showTable}>
                <div class="dcqt-shell__table">
                    <lightning-datatable
                        style={datatableStyle}
                        key-field="_rowUid"
                        data={tableRows}
                        columns={tableColumns}
                        hide-checkbox-column={hideSelectionColumn}
                        show-row-number-column={showRowNumberColumn}
                        column-widths-mode={resolvedColumnWidthsMode}
                        min-column-width={resolvedMinColumnWidth}
                        resize-column-disabled={resizeColumnDisabled}
                        wrap-table-header={wrapTableHeader}
                        wrap-text-max-lines={resolvedWrapTextMaxLines}
                        suppress-bottom-bar={suppressBottomBar}
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        onsort={handleSort}
                    >
                    </lightning-datatable>
                </div>
            </template>
            <template if:true={useStackedLayout}>
                <div class="dcqt-shell__table dcqt-stack" role="list">
                    <template for:each={stackedRows} for:item="row">
                        <div key={row.key} class="dcqt-stack__row" role="listitem">
                            <template if:true={row.indexLabel}>
                                <div class="dcqt-stack__index">{row.indexLabel}</div>
                            </template>
                            <dl class="dcqt-stack__fields">
                                <template for:each={row.fields} for:item="field">
                                    <div key={field.key} class="dcqt-stack__field">
                                        <dt class="dcqt-stack__label">{field.label}</dt>
                                        <dd class="dcqt-stack__value">{field.value}</dd>
                                    </div>
                                </template>
                            </dl>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </article>
</template>
